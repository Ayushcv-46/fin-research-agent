<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Financial Research Analyst</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">

  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Financial Research Analyst</h1>

    <!-- The input form -->
    <form id="report-form" class="bg-white p-6 rounded shadow space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Ticker</label>
        <input type="text" id="ticker" placeholder="AAPL"
               class="w-full border rounded px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Question</label>
        <input type="text" id="question" placeholder="How is the company doing?"
               class="w-full border rounded px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Judge Mode</label>
        <select id="judge_mode" class="w-full border rounded px-3 py-2">
          <option value="api">API Judge</option>
          <option value="finetuned">Fine-tuned Judge</option>
        </select>
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Run Research
      </button>
    </form>

    <!-- Live progress will get added here by JS -->
    <div id="progress" class="mt-6 space-y-2"></div>

    <!-- Final report will get rendered here by JS -->
    <div id="report-output" class="mt-6"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
